server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text-based responses (JS/CSS/JSON/SVG) - the app's whole bundle
    # is one of these, so this is a straightforward transfer-size win over the
    # wire with no correctness risk.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Security headers applied to every response. `always` ensures they're sent
    # on error responses too. The CSP allows the app's real dependencies:
    # Google Fonts, Google Sign-In (script + iframe), and remote listing images
    # scraped from third-party sites (img-src http/https).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: http:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    location /api/ {
        # Re-resolve the backend hostname at runtime via Docker's embedded DNS
        # (127.0.0.11) instead of caching its IP once at startup. Without this,
        # recreating the backend container (frequent here, since it's rebuilt
        # after code changes) gives it a new IP that nginx never picks up,
        # producing 502s until the frontend is also restarted.
        resolver 127.0.0.11 valid=10s;
        set $upstream_backend backend;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Forward the client IP so the backend's per-IP rate limiter keys on the
        # real browser address, not this proxy container.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        # Vite fingerprints every build output in this directory
        # (index-<hash>.js/css), so a given URL's content never changes -
        # safe to cache for as long as the browser wants. index.html (below,
        # not covered by this location) references the current hashes and is
        # left on nginx's default caching, so a new deploy is picked up on
        # the next page load rather than needing a cache-buster.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
