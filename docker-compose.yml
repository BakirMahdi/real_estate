services:
  db:
    image: postgres:16
    container_name: realestate-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Bound to loopback only: this is a raw Postgres port with whatever
      # password is in .env (the example password is weak), it must never be
      # reachable from outside the host it runs on.
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./db/migrate_ad_id.sql:/migrations/migrate_ad_id.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Same reasoning as the backend's limit below: cap Postgres so it can't
    # consume all host RAM. Raise if the host has more to spare.
    mem_limit: 1g
    memswap_limit: 1g

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realestate-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Concurrent detail-page (détails des annonces) fetches per site. Higher =
      # faster enrichment, until the target sites start throttling. Memory is
      # not the constraint here (enrichment is network-bound), so this can go up
      # as long as the sites tolerate it.
      SCRAPER_DETAIL_WORKERS: "16"
      # Number of websites scraped at the same time. All 3 run concurrently;
      # they hit different domains, so total time ~= the slowest single site.
      SCRAPER_SITE_CONCURRENCY: "3"
      # Where the trained price model artifact is read/written (mounted volume).
      MODEL_DIR: /app/models
      # Where the agent's generated secrets (read-only DB role password) live.
      DATA_DIR: /app/data
    ports:
      # Bound to loopback only: _client_ip() in main.py trusts
      # X-Forwarded-For unconditionally (nginx sets it correctly for
      # same-origin traffic), so a client hitting this port directly could
      # otherwise spoof that header and bypass the per-IP rate limits on
      # login/register/agent-chat.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./logs:/app/logs
      # Trained ML artifacts (price model) live on the host so a retrain
      # isn't needed after every image rebuild.
      - ./models:/app/models
      # Backend-generated secrets (e.g. the agent's read-only DB role
      # password) that must survive container recreation without being
      # committed to git.
      - ./data:/app/data
    # Safety net: cap the backend's memory so a heavy scrape can never consume
    # all host RAM and drag the whole machine (and the separate DB container)
    # down with it. If the limit is hit the backend alone is restarted
    # (restart: unless-stopped) instead of everything freezing. Raise this if
    # the host has plenty of RAM and you want more scrape concurrency.
    mem_limit: 2g
    memswap_limit: 2g # equal to mem_limit => no swap, so no slow swap-thrashing
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: realestate-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      # 127.0.0.1, not localhost: this image's localhost resolves to ::1
      # first and nginx isn't listening on IPv6, so wget would otherwise
      # always fail with "connection refused" despite nginx being healthy.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy
    # nginx serving a static build barely uses any memory; a small cap is
    # still cheap insurance against the container ever running away.
    mem_limit: 128m
    memswap_limit: 128m

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: realestate-pgadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Falls back to the same defaults as before when PGADMIN_DEFAULT_* are
      # unset in .env, so this doesn't break an existing setup - but set them
      # in .env instead of leaving them hardcoded here if this ever runs
      # somewhere besides localhost.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      # Server mode (the default for this image) requires the login above
      # instead of skipping straight to the DB browser.
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports:
      # Bound to loopback only - a DB GUI has no business being reachable
      # from outside the host it runs on.
      - "127.0.0.1:5433:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin_data:
